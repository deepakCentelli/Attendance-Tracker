<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <!-- Link external CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <!-- Settings Button -->
    <button id="settingsBtn" class="settings-btn" aria-label="Settings">⚙️</button>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>Settings</h3>
            <label>Target Hours</label>
            <input type="number" id="targetHoursInput" min="1" max="24" step="0.5">
            <div class="modal-actions">
                <button id="cancelSettings">Cancel</button>
                <button id="saveSettings">Save</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <header class="header">
            <h1 id="greeting">Hey User</h1>
            <div class="month-info">
                <span id="currentMonthLabel">August</span>
                <div class="avg-info">Avg: <span id="avgHours">0:00</span></div>
            </div>
        </header>

        <main class="main-layout">
            <!-- Left: Chart & Controls -->
            <section class="left-panel">
                <div class="chart-wrapper">
                    <canvas id="doughnutChart" width="260" height="260"></canvas>
                    <div class="chart-center">
                        <span id="punchStatus" class="status-badge">Punched Out</span>
                        <div id="timerDisplay" class="timer">00:00</div>
                        <span class="label">hrs</span>
                    </div>
                </div>
                
                <button id="punchBtn" class="btn-primary">Punch In</button>
                
                <div id="editPunchSection" class="edit-section hidden">
                    <label>Edit Start Time:</label>
                    <input type="time" id="editTimeInput">
                    <button id="saveEditBtn">Update</button>
                </div>
            </section>

            <!-- Right: List View -->
            <section class="right-panel">
                <div class="list-header">
                    <h3 id="listMonthTitle">August 2026</h3>
                    <div class="nav-arrows">
                        <button id="prevMonth">◀</button>
                        <button id="nextMonth">▶</button>
                    </div>
                </div>
                <div id="attendanceList" class="attendance-list">
                    <!-- Items injected via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Load Scripts in Order -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/chart.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
