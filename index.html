<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <button id="settingsBtn" class="settings-btn" aria-label="Settings">⚙️</button>
    
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>Settings</h3>
            <label>Username</label>
            <input type="text" id="usernameInput" placeholder="Enter your name">
            <label>Target Hours</label>
            <input type="number" id="targetHoursInput" min="1" max="24" step="0.5">
            <div class="modal-actions">
                <button id="cancelSettings">Cancel</button>
                <button id="saveSettings">Save</button>
            </div>
        </div>
    </div>
    
    <div class="app-container">
        <div class="dashboard-container">
            <section class="left-section">
                <div class="greeting-section">
                    <h1 id="greeting" class="greeting-main">Hey User</h1>
                    <p id="welcomeText" class="greeting-sub">Welcome Back</p>
                </div>
                
                <div class="quote-container">
                    <p id="dailyQuote" class="quote-text"></p>
                </div>
                
                <div class="timer-section">
                    <div class="chart-wrapper">
                        <canvas id="doughnutChart" width="340" height="340"></canvas>
                        <div class="chart-center">
                            <span id="punchStatus" class="status-badge">Punched Out</span>
                            <div id="timerDisplay" class="timer-display">00:00</div>
                            <span class="timer-unit">hrs</span>
                        </div>
                    </div>
                    
                    <div class="punch-buttons">
                        <button id="punchBtn" class="btn-punch btn-punch-in">Punch In</button>
                        <button id="punchOutBtn" class="btn-punch btn-punch-out hidden">Punch Out</button>
                    </div>
                    
                    <div id="editPunchSection" class="edit-section hidden">
                        <label>Edit Start Time:</label>
                        <input type="time" id="editTimeInput">
                        <button id="saveEditBtn">Update</button>
                    </div>
                </div>
            </section>
            
            <section class="right-section">
                <div class="monthly-panel">
                    <div class="monthly-header">
                        <h2 id="monthTitle" class="month-title">August</h2>
                        <div class="avg-container">
                            <span class="avg-label">Avg Per Day</span>
                            <span id="avgValue" class="avg-value">0:00</span>
                        </div>
                        <div class="nav-arrows">
                            <button id="prevMonth" class="nav-btn">◀</button>
                            <button id="nextMonth" class="nav-btn">▶</button>
                        </div>
                    </div>
                    
                    <div id="attendanceList" class="attendance-list"></div>
                </div>
            </section>
        </div>
    </div>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/storage.js" type="module"></script>
    <script src="components/AttendanceRow.js"></script>
    <script src="assets/js/chart.js"></script>
    <script src="assets/js/main.js" type="module"></script>
</body>
</html>
